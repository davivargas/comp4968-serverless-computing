AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Lets GitHub Actions deploy the Timely stack without stored AWS keys (OpenID Connect).
  Only workflow runs on the chosen branch of the chosen repository can use the role.
  Deploy this once, by hand, as its own stack. It is separate from Timely, so deleting
  Timely never removes it.

Parameters:
  GitHubOrg:
    Type: String
    Default: davivargas
  GitHubRepo:
    Type: String
    Default: comp4968-serverless-computing
  Branch:
    Type: String
    Default: main
  GitHubOwnerId:
    Type: String
    Default: "59944975"
    Description: Numeric ID of the GitHub owner. Newer GitHub tokens include it in the subject claim (repo:owner@id/name@id:...).
  GitHubRepoId:
    Type: String
    Default: "1396593638"
    Description: Numeric ID of the GitHub repository (same reason as above).
  DeployedStackName:
    Type: String
    Default: Timely
    Description: The stack the pipeline deploys. It decides which IAM roles the pipeline may manage.
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      An AWS account can have only one GitHub OIDC provider. If this account already has one
      (IAM > Identity providers > token.actions.githubusercontent.com), choose "false".

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: GitHubDeploy-Timely
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRoleWithWebIdentity
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:ref:refs/heads/${Branch}
                  - !Sub repo:${GitHubOrg}@${GitHubOwnerId}/${GitHubRepo}@${GitHubRepoId}:ref:refs/heads/${Branch}
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: ManageDeployedStackRoles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${DeployedStackName}-*
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"

Outputs:
  RoleArn:
    Description: Put this in .github/workflows/deploy-backend.yml (role-to-assume)
    Value: !GetAtt DeployRole.Arn

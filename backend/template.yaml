AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Timesheet & payroll MVP backend. VPC with endpoints (no NAT, no internet), RDS PostgreSQL (deletion protection on),
  Cognito, API Gateway, 10 Python Lambdas + shared layer, SQS audit queue, DynamoDB audit table, KMS, Secrets Manager.
  Build first with scripts/build.sh (creates dist/*.zip), then run: sam deploy --guided

Parameters:
  DeletionProtection:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "true" protects the database, the audit table and the user pool from deletion, so the stack cannot be deleted.
      To delete the stack later, redeploy once with "false", then delete it.
  DbName:
    Type: String
    Default: payroll
    AllowedPattern: "[a-z][a-z0-9_]{0,62}"
  DbEngineVersion:
    Type: String
    Default: "16.13"
    Description: >
      PostgreSQL version. If AWS rejects it, list the current ones with:
      aws rds describe-db-engine-versions --engine postgres --query "DBEngineVersions[].EngineVersion" --region us-west-2
      and pick a 16.x (or 17.x) version.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    Description: db.t4g.micro is enough for an MVP; use db.t4g.small or larger for real use.
  DbMultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  DbBackupDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PrivateSubnetACidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24
  EndpointsInBothAZs:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "false puts each interface endpoint in one AZ only (cheaper). true puts it in both (about double the endpoint cost)."
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Web app origin allowed to call the API, e.g. https://d123.cloudfront.net. "*" is for testing only.
  PayPeriodAnchor:
    Type: String
    Default: "2026-01-04"
    Description: First pay period start. Must be a Sunday.
  PayDateLagDays:
    Type: Number
    Default: 6
    Description: Days from the end of a pay period (a Saturday) to the pay date. 6 means the Friday after the period ends. BC allows up to 8.
  SesSourceArn:
    Type: String
    Default: ""
    Description: >
      Optional. ARN of a verified SES identity (e.g. arn:aws:ses:us-west-2:123456789012:identity/payroll@example.com).
      When set, Cognito sends invite emails through SES. Leave empty to use Cognito's built-in email (small daily limit).

  ReminderSenderEmail:
    Type: String
    Default: group1.timely.demo@gmail.com
    Description: >
      Address the reminder emails are sent from. It must be verified in Amazon SES (SES console, Identities,
      Create identity, then click the link SES emails to that address). Verify it once; it is not part of this stack.
  ReminderRedirectEmail:
    Type: String
    Default: group1.timely.demo@gmail.com
    Description: >
      Every reminder is sent to this one address (the intended person is named in the subject). While SES is in sandbox
      mode it must also be verified. Leave empty to send each reminder to the person's own email address (needs SES production access).

Conditions:
  Protect: !Equals [!Ref DeletionProtection, "true"]
  EndpointsBoth: !Equals [!Ref EndpointsInBothAZs, "true"]
  UseSes: !Not [!Equals [!Ref SesSourceArn, ""]]

Globals:
  Function:
    Runtime: python3.12
    Handler: lambda_function.lambda_handler
    Architectures: [x86_64]
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        CORS_ORIGIN: !Ref CorsOrigin
        PAY_PERIOD_ANCHOR: !Ref PayPeriodAnchor
        PAY_DATE_LAG_DAYS: !Ref PayDateLagDays

Resources:
  # ---------------------------------------------------------------- network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-a" }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private-b" }]

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-private" }]

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      { SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTable }

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      { SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTable }

  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions that use the database
      VpcId: !Ref Vpc

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL, reachable only from the Lambda security group
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 5432,
            ToPort: 5432,
            SourceSecurityGroupId: !Ref LambdaSecurityGroup,
            Description: Lambda functions,
          }

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: VPC interface endpoints, reachable only from the Lambda security group
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - {
            IpProtocol: tcp,
            FromPort: 443,
            ToPort: 443,
            SourceSecurityGroupId: !Ref LambdaSecurityGroup,
            Description: Lambda functions,
          }

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      SubnetIds:
        !If [
          EndpointsBoth,
          [!Ref PrivateSubnetA, !Ref PrivateSubnetB],
          [!Ref PrivateSubnetA],
        ]

  KmsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      SubnetIds:
        !If [
          EndpointsBoth,
          [!Ref PrivateSubnetA, !Ref PrivateSubnetB],
          [!Ref PrivateSubnetA],
        ]

  SqsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sqs"
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      SubnetIds:
        !If [
          EndpointsBoth,
          [!Ref PrivateSubnetA, !Ref PrivateSubnetB],
          [!Ref PrivateSubnetA],
        ]

  SnsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.sns"
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      SubnetIds:
        !If [
          EndpointsBoth,
          [!Ref PrivateSubnetA, !Ref PrivateSubnetB],
          [!Ref PrivateSubnetA],
        ]

  CognitoIdpEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Interface
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.cognito-idp"
      PrivateDnsEnabled: true
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      SubnetIds:
        !If [
          EndpointsBoth,
          [!Ref PrivateSubnetA, !Ref PrivateSubnetB],
          [!Ref PrivateSubnetA],
        ]

  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      VpcEndpointType: Gateway
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      RouteTableIds: [!Ref PrivateRouteTable]

  # ---------------------------------------------------------------- database
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Database login used by the Lambda functions
      GenerateSecretString:
        SecretStringTemplate: '{"username": "payroll_admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the payroll database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  DbInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: !Ref DbEngineVersion
      DBInstanceClass: !Ref DbInstanceClass
      DBName: !Ref DbName
      MasterUsername: payroll_admin
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      AllocatedStorage: "20"
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !Ref DbMultiAZ
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      BackupRetentionPeriod: !Ref DbBackupDays
      DeletionProtection: !If [Protect, true, false]
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true
      EnableCloudwatchLogsExports: [postgresql]

  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref DbInstance
      TargetType: AWS::RDS::DBInstance

  DepositKey:
    Type: AWS::KMS::Key
    Properties:
      Description: Encrypts direct-deposit account numbers (employee-profiles Lambda)
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }
            Action: "kms:*"
            Resource: "*"

  DepositKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub "alias/${AWS::StackName}-deposit"
      TargetKeyId: !Ref DepositKey

  # ---------------------------------------------------------------- audit trail
  AuditDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  AuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AuditDeadLetterQueue.Arn
        maxReceiveCount: 5

  AuditTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: month, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: month, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [Protect, true, false]

  # ---------------------------------------------------------------- reminders
  ReminderTopic:
    Type: AWS::SNS::Topic

  NotificationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  NotificationQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt NotificationDeadLetterQueue.Arn
        maxReceiveCount: 5

  NotificationQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues: [!Ref NotificationQueue]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: sns.amazonaws.com }
            Action: sqs:SendMessage
            Resource: !GetAtt NotificationQueue.Arn
            Condition:
              ArnEquals: { "aws:SourceArn": !Ref ReminderTopic }

  ReminderSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: NotificationQueuePolicy
    Properties:
      TopicArn: !Ref ReminderTopic
      Protocol: sqs
      Endpoint: !GetAtt NotificationQueue.Arn
      RawMessageDelivery: true

  # ---------------------------------------------------------------- sign-in
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${AWS::StackName}-users"
      DeletionProtection: !If [Protect, ACTIVE, INACTIVE]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: Your timesheet account
          EmailMessage: "Your timesheet account is ready. Sign in with {username} and the temporary password {####}. You will be asked to choose a new password."
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      EmailConfiguration: !If
        - UseSes
        - { EmailSendingAccount: DEVELOPER, SourceArn: !Ref SesSourceArn }
        - { EmailSendingAccount: COGNITO_DEFAULT }
      Schema:
        - {
            Name: email,
            AttributeDataType: String,
            Required: true,
            Mutable: true,
          }

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: web-app
      GenerateSecret: false
      ExplicitAuthFlows: [
          ALLOW_USER_SRP_AUTH,
          ALLOW_REFRESH_TOKEN_AUTH,
          ALLOW_ADMIN_USER_PASSWORD_AUTH,
        ] # the last one lets you get a test token from the CLI (needs AWS credentials)
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders: [COGNITO]
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits:
        { AccessToken: minutes, IdToken: minutes, RefreshToken: hours }

  # ---------------------------------------------------------------- API
  Api:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      EndpointConfiguration: { Type: REGIONAL }
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity: { Header: Authorization }
      Cors:
        AllowOrigin: !Sub "'${CorsOrigin}'"
        AllowHeaders: "'Content-Type,Authorization,X-Active-Role'"
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsOrigin}'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: !Sub "'${CorsOrigin}'"
      MethodSettings:
        - {
            ResourcePath: "/*",
            HttpMethod: "*",
            MetricsEnabled: true,
            ThrottlingBurstLimit: 50,
            ThrottlingRateLimit: 25,
          }

  # ---------------------------------------------------------------- web app hosting
  # The built React app lives in a private bucket that only CloudFront can read. CloudFront serves it over
  # HTTPS and also forwards /prod/* to API Gateway, so the app and the API share one origin (no CORS needed).
  # .github/workflows/deploy-frontend.yml builds the app and uploads it here.
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}"

  WebOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-web"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Page URLs such as /auditor/logs only exist inside the React app: serve index.html for any path without
  # a file extension. (Custom error pages would do the same, but would also swallow the API's own 403/404s.)
  WebSpaRewrite:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for app routes
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('.') === -1) request.uri = '/index.html';
          return request;
        }

  # Never caches API responses (they carry no Cache-Control, so the 0s default applies). Authorization and
  # X-Active-Role are in the key because that's how CloudFront is made to forward Authorization at all.
  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-no-cache"
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          HeadersConfig:
            HeaderBehavior: whitelist
            Headers: [Authorization, X-Active-Role]
          CookiesConfig: { CookieBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} web app"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        DefaultRootObject: index.html
        Origins:
          - Id: web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
          - Id: api
            DomainName: !Sub "${Api}.execute-api.${AWS::Region}.amazonaws.com"
            CustomOriginConfig: { OriginProtocolPolicy: https-only, OriginSSLProtocols: [TLSv1.2] }
        DefaultCacheBehavior:
          TargetOriginId: web
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized (honours the upload's Cache-Control)
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt WebSpaRewrite.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /prod/*
            TargetOriginId: api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            Compress: true
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ---------------------------------------------------------------- Lambda
  CommonLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-payroll-common"
      Description: payroll_common - router, auth, DB, audit queue, payroll maths (pg8000, tzdata)
      ContentUri: dist/payroll-common-layer.zip
      CompatibleRuntimes: [python3.12]
      RetentionPolicy: Delete

  AccountManagementFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/account-management.zip
      Description: account-management
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
          AUDIT_QUEUE_URL: !Ref AuditQueue
          USER_POOL_ID: !Ref UserPool
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AuditQueue.Arn
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminResetUserPassword
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminEnableUser
                - cognito-idp:AdminUserGlobalSignOut
                - cognito-idp:AdminUpdateUserAttributes
              Resource: !GetAtt UserPool.Arn
      Events:
        Route01:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/create-account"
            Method: post
        Route02:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/users"
            Method: get
        Route03:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/users/{id}"
            Method: get
        Route04:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/users/{id}/reset-password"
            Method: post
        Route05:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/users/{id}"
            Method: patch
        Route06:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/users/{id}/status"
            Method: patch
        Route07:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/users/{id}/role"
            Method: patch
        Route08:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/teams"
            Method: get
        Route09:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/teams"
            Method: post
        Route10:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/teams/{id}"
            Method: patch
        Route11:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/positions"
            Method: get
        Route12:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/auditors"
            Method: post
        Route13:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/auditors"
            Method: get
        Route14:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/auditors/{id}"
            Method: get
        Route15:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/auditors/{id}/status"
            Method: patch
        Route16:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/it/auditors/{id}/reset-password"
            Method: post

  EmployeeTimesheetsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/employee-timesheets.zip
      Description: employee-timesheets
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
          AUDIT_QUEUE_URL: !Ref AuditQueue
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
        - Statement:
            - Effect: Allow
              Action: sqs:SendMessage
              Resource: !GetAtt AuditQueue.Arn
      Events:
        Route01:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/employee/{id}/pay-period"
            Method: get
        Route02:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/employee/{id}/timesheets"
            Method: get
        Route03:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/employee/{id}/sick-days"
            Method: get
        Route04:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/employee/{id}/timesheets"
            Method: post
        Route05:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: "/employee/{id}/timesheets/{timesheetId}"
            Method: delete
        Route06:
          Type: Api
          Properties:

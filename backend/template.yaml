  TimesheetReminderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/timesheet-reminder.zip
      Description: timesheet-reminder
      Timeout: 60
      Layers: [!Ref CommonLayer]
      VpcConfig:
        SecurityGroupIds: [!Ref LambdaSecurityGroup]
        SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      Environment:
        Variables:
          DB_SECRET_ARN: !Ref DbSecret
          DB_NAME: !Ref DbName
          REMINDER_TOPIC_ARN: !Ref ReminderTopic
      Policies:
        - Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref DbSecret
        - Statement:
            - Effect: Allow
              Action: sns:Publish
              Resource: !Ref ReminderTopic
      Events:
        # 9:00 AM in BC (UTC-7 all year) is 16:00 UTC. Friday: employees, Monday: managers, Tuesday: Payroll Admins.
        # The function only sends on the right Friday/Monday/Tuesday of a pay period; the other weeks it does nothing.
        EmployeesFriday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 16 ? * FRI *)"
            Input: '{"role": "EMPLOYEE", "scheduled": true}'
            RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }
        ManagersMonday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 16 ? * MON *)"
            Input: '{"role": "MANAGER", "scheduled": true}'
            RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }
        PayrollAdminsTuesday:
          Type: ScheduleV2
          Properties:
            ScheduleExpression: "cron(0 16 ? * TUE *)"
            Input: '{"role": "PAYROLL_ADMIN", "scheduled": true}'
            RetryPolicy: { MaximumRetryAttempts: 2, MaximumEventAgeInSeconds: 3600 }

  NotificationWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: dist/notification-worker.zip
      Description: notification-worker
      Timeout: 30
      Environment:
        Variables:
          SENDER_EMAIL: !Ref ReminderSenderEmail
          REDIRECT_TO: !Ref ReminderRedirectEmail
      Policies:
        - Statement:
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub "arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        NotificationQueueEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt NotificationQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

  DbInitFunction:
    Type: AWS::Serverless::Function
    Properties:

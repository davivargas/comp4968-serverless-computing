            Queue: !GetAtt AuditQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]

Outputs:
  ApiUrl:
    Description: Base URL for the web app (stage prod)
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/prod"
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  DbEndpoint:
    Value: !GetAtt DbInstance.Endpoint.Address
  DbName:
    Value: !Ref DbName
  DbSecretArn:
    Description: Secret holding the database host, user and password (for loading the schema with psql)
    Value: !Ref DbSecret
  PrivateSubnetId:
    Description: Subnet to use for a CloudShell VPC environment when loading the schema
    Value: !Ref PrivateSubnetA
  LambdaSecurityGroupId:
    Description: Security group to use for a CloudShell VPC environment (it may reach the database)
    Value: !Ref LambdaSecurityGroup
  DbInitFunctionName:
    Description: One-off setup Lambda - invoke it to load the schema and create the first IT admin
    Value: !Ref DbInitFunction
  AuditQueueUrl:
    Value: !Ref AuditQueue
  AuditTableName:
    Value: !Ref AuditTable
  DepositKeyArn:
    Value: !GetAtt DepositKey.Arn
  TimesheetReminderFunctionName:
    Description: Invoke by hand to send a reminder now, e.g. payload {"role":"EMPLOYEE"} (MANAGER and PAYROLL_ADMIN also work)
    Value: !Ref TimesheetReminderFunction
  NotificationQueueUrl:
    Value: !Ref NotificationQueue
  WebsiteUrl:
    Description: The web app (CloudFront)
    Value: !Sub "https://${WebDistribution.DomainName}"
  WebApiUrl:
    Description: API base URL for the web app's build (VITE_API_BASE_URL) - the API through CloudFront, same origin as the app
    Value: !Sub "https://${WebDistribution.DomainName}/prod"
  WebBucketName:
    Description: Bucket the frontend workflow uploads the built app to
    Value: !Ref WebBucket
  WebDistributionId:
    Description: CloudFront distribution to invalidate after each frontend deploy
    Value: !Ref WebDistribution

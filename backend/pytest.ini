# pytest settings for the backend tests.
# pytest picks up this file automatically when run from the backend/ folder.

[pytest]
# Only collect tests from tests/. This skips .venv/, functions/ and layers/.
testpaths = tests

# --import-mode=importlib: import each test file on its own. Two folders can then both
#   contain a file with the same name (e.g. test_permissions.py) without a clash. It also
#   means no __init__.py is needed, which matters because folder names like
#   account-management contain hyphens and so can't be Python packages.
# -ra: print a short summary at the end of every test that didn't pass
#   (failed, errored, skipped).
addopts = --import-mode=importlib -ra

# Folders added to sys.path while tests run:
#   tests         lets tests write `from helpers.events import api_event`
#   layers/common/python lets tests write `import payroll_common`, the same way the deployed Lambdas do
pythonpath = tests layers/common/python
